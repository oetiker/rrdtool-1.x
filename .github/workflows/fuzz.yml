name: "Fuzz"
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [ rrd_open_fuzzer, rrd_restore_fuzzer ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autopoint build-essential clang libtool-bin \
                                libpango1.0-dev libxml2-dev gettext

    - name: Verify sanitizer failure handling
      run: bash fuzz/test-run.sh

    - name: Build fuzz harnesses
      run: |
        ./bootstrap
        ./configure --enable-fuzzing --disable-shared --disable-libwrap --disable-docs --disable-librados --disable-libdbi --disable-perl --disable-python --disable-tcl --disable-lua CC=clang \
                    CFLAGS='-O1 -g'
        make

    - name: Restore mutation corpus
      id: corpus
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: fuzz-state/${{ matrix.harness }}/corpus
        key: fuzz-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.harness }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          fuzz-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.harness }}-

    # The coverage job uses a fixed seed; this job keeps mutating its saved
    # corpus, for a few minutes on each change and longer every night.
    - name: Fuzz
      id: fuzz
      env:
        FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        HARNESS: ${{ matrix.harness }}
      run: |
        bash fuzz/run.sh "fuzz/$HARNESS" "fuzz-state/$HARNESS" \
          -max_total_time="$FUZZ_SECONDS" -timeout=25 -rss_limit_mb=2048

    - name: Preserve fuzz logs, reproducers and corpus
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.harness }}-artifacts
        path: |
          fuzz-state/${{ matrix.harness }}/
          /tmp/rrd-fuzz-run.*/
        retention-days: 30
        if-no-files-found: warn

    # Separate save action also runs when the fuzzer finds a bug. Unique keys
    # are required because cache entries cannot be updated in place.
    - name: Save mutation corpus
      if: ${{ always() && steps.fuzz.outcome != 'skipped' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: fuzz-state/${{ matrix.harness }}/corpus
        key: ${{ steps.corpus.outputs.cache-primary-key }}
