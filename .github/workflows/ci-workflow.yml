---
name: Windows CI

# yamllint disable rule:line-length
# yamllint disable-line rule:truthy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:


permissions:
  contents: read

jobs:
  msys2:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
        os: [windows-2022]
        carch: [x86_64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
        shell: cmd
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: base-devel bc groff mingw-w64-x86_64-autotools mingw-w64-x86_64-toolchain mingw-w64-x86_64-cairo mingw-w64-x86_64-expat mingw-w64-x86_64-freetype mingw-w64-x86_64-gettext mingw-w64-x86_64-glib2 mingw-w64-x86_64-libpng mingw-w64-x86_64-libxml2 mingw-w64-x86_64-pango mingw-w64-x86_64-zlib mingw-w64-x86_64-pkgconf
      - name: CI-Build
        run: |
          echo 'Running in MSYS2!'
          ./ci-build_MSYS2.sh
      # - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   with:
      #     name: test-suite.log
      #     path: tests/test-suite.log
  MSVC:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
        os: [windows-2022]
        vcpkg_triplet: [x64-windows, x86-windows]
        include:
          - os: windows-2022
            vcpkg_triplet: x64-windows
            # https://github.com/microsoft/vcpkg/releases/tag/2025.12.12
            # https://github.com/microsoft/vcpkg/commit/84bab45d415d22042bd0b9081aea57f362da3f35
            vcpkgCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
            vcpkgPackages: 'cairo expat fontconfig freetype gettext glib libpng libxml2 pango zlib'
            configuration: 'x64'
            nmake_configuration: 'USE_64BIT=1'
          - os: windows-2022
            vcpkg_triplet: x86-windows
            vcpkgCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
            vcpkgPackages: 'cairo expat fontconfig freetype gettext glib libpng libxml2 pango zlib'
            configuration: 'x86'
            nmake_configuration: ''
    defaults:
      run:
        shell: cmd
    env:
      buildDir: '${{ github.workspace }}/build/'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true

      # vcpkg-action
      # https://github.com/johnwason/vcpkg-action
      - name: vcpkg build
        uses: johnwason/vcpkg-action@04c68c847bf5196ecaa72331ecf51208583916ef # v8.0.0
        id: vcpkg
        with:
          pkgs: '${{ matrix.vcpkgPackages }}'
          triplet: ${{ matrix.vcpkg_triplet }}
          cache-key: ${{ matrix.configuration }}
          revision: '${{ matrix.vcpkgCommitId}}'
          token: ${{ github.token }}

      - name: Build ${{ matrix.configuration }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.configuration }}
          nmake -f win32\Makefile_vcpkg.msc ${{ matrix.nmake_configuration }}

      - name: Collect files
        run: |
          win32\collect_rrdtool_vcpkg_files.bat ${{ matrix.configuration }}

      # Same SBOM step as the release workflow, so a vcpkg bump that renames
      # or adds a shipped DLL fails here instead of at release time.
      - name: Generate SBOM
        shell: bash
        env:
          CFG: ${{ matrix.configuration }}
          TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          set -e
          name="rrdtool-$(cat VERSION)-${CFG}_vcpkg"
          python win32/vcpkg_sbom.py --installed "vcpkg/installed/${TRIPLET}" \
              --release-dir "win32/nmake_release_${CFG}_vcpkg/${name}" \
              --version "$(cat VERSION)" --name "$name" --output "${name}.spdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.configuration }}
          path: rrdtool-*_vcpkg.spdx.json
          if-no-files-found: error
