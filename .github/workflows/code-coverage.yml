name: "Code Coverage"
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autopoint build-essential libdbi-dev libtool-bin tcl-dev lua5.1 liblua5.1-0-dev \
                                valgrind gcovr dc python3-pip python3-setuptools libpango1.0-dev ghostscript gettext
        sudo pip install cpp-coveralls

    - name: Build
      run: |
        ./bootstrap
        ./configure --prefix=/opt/rrdtool-master \
                    CFLAGS='-fprofile-arcs -ftest-coverage -O0' \
                    LIBS=-lgcov
        make
        sudo make install
        /opt/rrdtool-master/bin/rrdtool
        /opt/rrdtool-master/share/rrdtool/examples/4charts.pl
    - name: Run Checks
      run: |
        make check
    - name: Test bindings
      run: |
        (cd bindings/perl-shared && make test)
        (cd bindings/python && sudo chown -R "$USER" . && PYTHONPATH=/opt/rrdtool-master/lib/python3/site-packages python -m unittest discover -v -s tests -t .)
    - name: Run "rrdcached-tcp"
      run: |
        make check TESTS_STYLE="rrdcached-tcp"
    - name: Run "rrdcached-udp"
      run: |
        make check TESTS_STYLE="rrdcached-unix"
    - name: Run valgrind
      run: |
        # make check TESTS_STYLE="valgrind-logfile"
        make check TESTS_STYLE="valgrind-logfile" TESTS="modify1 modify2 modify3 modify4 modify5 tune1 tune2 graph1 graph2 rpn1 rpn2 rrdcreate compat-cloexec dump-restore create-with-source-1 create-with-source-2 create-with-source-3 create-with-source-4 create-with-source-and-mapping-1 create-from-template-1 dcounter1 vformatter1 xport1 list1 pdp-calc1"
        podchecker doc/*.pod
    - name: Show valgrind error reports
      if: ${{ failure() }}
      run: |
        # test-suite.log only carries the LEAK/ERROR SUMMARY; the reports
        # themselves are in tests/<test>-valgrind.log. Print the error
        # blocks of every process that counted errors (first pass: find
        # those PIDs; second pass: print their reports, minus the
        # still-reachable and indirectly-lost records that do not count).
        shopt -s nullglob
        for log in tests/*-valgrind.log; do
          grep -q 'ERROR SUMMARY: [1-9]' "$log" || continue
          echo "::group::$log"
          awk '
            FNR == NR { if (/ERROR SUMMARY: [1-9]/) bad[$1] = 1; next }
            !($1 in bad) { next }
            /^==[0-9]+== Command:/ { print "-----"; print; next }
            /^==[0-9]+== *$/ { if (blk) print ""; blk = 0; next }
            /^==[0-9]+== ERROR SUMMARY:/ { print; print ""; next }
            /^==[0-9]+== [^ ]/ {
              blk = !/== (Memcheck,|Copyright|Using Valgrind|Parent PID|HEAP SUMMARY|LEAK SUMMARY|FILE DESCRIPTORS|All heap blocks|For lists of|For counts of|Rerun with|To see them|.* still reachable|.* indirectly lost)/
            }
            blk { print }
          ' "$log" "$log"
          echo "::endgroup::"
        done
    - name: Upload valgrind logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: valgrind-logs
        path: |
          tests/test-suite.log
          tests/*-valgrind.log
          tests/*-valgrind*.tmp
        if-no-files-found: ignore
    - name: Merge coverage reports
      run: |
        # Merge static, shared, and regression-test counters before upload.
        # Collect test-object counters too, but report application sources;
        # failing assertions are test outcomes, not untested application paths.
        gcovr --root . --filter src/ --xml-pretty --output coverage.xml \
          --lcov coverage-full.info --print-summary src tests
        # The existing Codecov baseline measures lines, not branch completeness.
        # Retain all DA line counts, including zero-hit lines, for comparison.
        sed '/^BRDA:/d; /^BRF:/d; /^BRH:/d' coverage-full.info > coverage.info
    - name: Preserve full line and branch coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-full
        path: |
          coverage.xml
          coverage-full.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      with:
        files: coverage.info
        disable_search: true
        plugins: noop

  fuzz:
    name: Fuzz harness coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autopoint build-essential clang llvm libtool-bin \
                                libpango1.0-dev libxml2-dev gettext

    - name: Build fuzz harnesses
      run: |
        ./bootstrap
        ./configure --enable-fuzzing --disable-shared --disable-libwrap --disable-docs --disable-librados --disable-libdbi --disable-perl --disable-python --disable-tcl --disable-lua CC=clang \
                    CFLAGS='-O1 -g -fprofile-instr-generate -fcoverage-mapping' \
                    LDFLAGS='-fprofile-instr-generate -fcoverage-mapping'
        make

    - name: Run instrumented open and restore regressions
      run: |
        mkdir -p /tmp/rrd-fuzz-profiles
        LLVM_PROFILE_FILE='/tmp/rrd-fuzz-profiles/test-%p.profraw' \
          make check TESTS="security-header-counts rrd-open-security security-rados-bounds security-restore-zero-row-cnt security-restore-malformed-row dump-restore"

    - name: Exercise seed corpora
      run: |
        mkdir -p /tmp/rrd-fuzz-corpus
        cp fuzz/corpus/* /tmp/rrd-fuzz-corpus/
        LLVM_PROFILE_FILE='/tmp/rrd-fuzz-profiles/open-%p.profraw' \
          fuzz/rrd_open_fuzzer -seed=1 -runs=10000 /tmp/rrd-fuzz-corpus
        LLVM_PROFILE_FILE='/tmp/rrd-fuzz-profiles/restore-%p.profraw' \
          fuzz/rrd_restore_fuzzer -seed=1 -runs=10000 /tmp/rrd-fuzz-corpus
        llvm-profdata merge -sparse /tmp/rrd-fuzz-profiles/*.profraw -o fuzz.profdata
        llvm-cov export -format=lcov \
          -instr-profile=fuzz.profdata \
          fuzz/rrd_open_fuzzer \
          -object fuzz/rrd_restore_fuzzer \
          >fuzz-coverage-full.info
        sed '/^BRDA:/d; /^BRF:/d; /^BRH:/d' fuzz-coverage-full.info > fuzz-coverage.info

    - name: Preserve full fuzz line and branch coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-coverage-full
        path: fuzz-coverage-full.info

    - name: Upload fuzz coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
      with:
        files: fuzz-coverage.info
        disable_search: true
        plugins: noop
        flags: fuzz
